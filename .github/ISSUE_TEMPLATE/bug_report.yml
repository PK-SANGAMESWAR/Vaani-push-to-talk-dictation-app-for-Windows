name: Bug report
description: Something does not work (nothing pasted, wrong text, hotkey stops, crash)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Which app had focus when you dictated? Hold or toggle mode? Cleanup on or off?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: vaani.log
      description: |
        Run `run-debug.bat`, reproduce the problem, then paste the last ~50 lines of
        `%LOCALAPPDATA%\Vaani\vaani.log`. Check it for anything private first.
      render: text
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU model
      placeholder: NVIDIA GeForce RTX 4050 Laptop GPU (or "none, CPU only")
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: NVIDIA driver version
      description: "`nvidia-smi` shows it. CUDA 13 needs R580 or newer."
      placeholder: "591.66"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vaani commit
      description: "`git rev-parse --short HEAD`"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Changes you made to config.toml
      description: Only the keys that differ from the default. Remove private snippets.
      render: toml
