[project]
name = "vaani"
version = "0.1.0"
description = "Fully local push-to-talk dictation for Windows (Parakeet + Silero VAD + optional Ollama cleanup)"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # ruff format handles code line length; prompt strings may be long

[tool.pytest.ini_options]
testpaths = ["tests"]
